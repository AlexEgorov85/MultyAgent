schema: spec-driven

context: |
  Проект: «Ассистент внутреннего аудитора» — учебная мультиагентная система на LangGraph.
  Домен: внутренний аудит банка. Сущности: карманы → проверки → акты → пункты-находки → скрипты.
  Стек: Python 3.11–3.12, LangGraph, Pydantic, PostgreSQL 16 через pgserver, pgvector,
  psycopg, sqlglot, assistant-ui (React/Next.js) поверх LangGraph API server.
  Данные: детерминированная синтетика, random.Random(42), 10 карманов (5 тем × 2025/2026).
  Язык: все предметные и пользовательские значения — на русском; технические идентификаторы,
  имена таблиц/колонок, SQL и код скриптов — латиницей. Streamlit запрещён.
  Протокол межагентного взаимодействия: FIPA-ACL-конверт.
  Источник требований: ПЛАН_ПРОЕКТА.md. Спецификации — целевое поведение;
  реализация — в src/ и scripts/, расхождения фиксируются в docs/qa.md.

rules:
  proposal:
    - Ссылаться на ПЛАН_ПРОЕКТА.md и затронутые спецификации.
    - Не добавлять требования, которых нет в плане, без явной пометки.
  tasks:
    - Задачи атомарные, не более 4 часов.
    - Для каждой задачи указывать проверяемый результат.
  design:
    - Фиксировать альтернативы и ограничения, а не пересказывать план.
